[project]
name = "carla-interface"
version = "0.0.0"
authors = [{ name = "MamoruDS", email = "mamoruds.io@gmail.com" }]
dependencies = ["typing-extensions>=4.12.2"]
readme = "README.md"
requires-python = ">= 3.8"

[project.optional-dependencies]
cli = ["typed-cap>=0.3.1"]
build = ["pybind11-stubgen>=2.5.1", "pyserde[yaml]>=0.19.3", "pyyaml>=6.0.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.rye]
managed = true
dev-dependencies = ["ruff>=0.4.8"]

[tool.rye.scripts]
build = { cmd = "sh build.sh" }

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["dist/carla"]
