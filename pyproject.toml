[project]
name = "carla-interface"
version = "0.0.0"
authors = [{ name = "MamoruDS", email = "mamoruds.io@gmail.com" }]
dependencies = [
    "pyserde[yaml]>=0.19.3",
    "pybind11-stubgen>=2.5.1",
    "typing-extensions>=4.12.2",
]
readme = "README.md"
requires-python = ">= 3.8"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.rye]
managed = true
dev-dependencies = ["ruff>=0.4.8"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/carla"]
